services:

  db:
    image: postgres:13
    restart: always
    env_file:
      - .env
    ports:
      - "6543:5432"
    volumes:
      - db:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "7656:7656"
    volumes:
      - .:/app

volumes:
  db: